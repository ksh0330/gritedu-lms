<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>그릿에듀 | 운영 기록 정리</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#ff7a00" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <script type="module" src="/assets/js/firebase-init.js"></script>
  <script type="module" src="/assets/js/common.js"></script>
  <script src="/assets/js/pwa-register.js" defer></script>
  <script type="module" src="/assets/js/pages/admin-operation-tasks.js"></script>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/pages/admin-operation-tasks.css">
</head>
<body>
  <div data-include="header"></div>

  <main class="grit-page-container operation-task-page">
    <div class="dash-back">
      <a href="/members/admin/dashboard.html" class="btn sm dash-back__link" aria-label="관리자 CMS로 돌아가기" title="관리자 CMS로 돌아가기">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </a>
    </div>

    <section class="grit-section">
      <div class="section-head page-header-row">
        <div>
          <h1 class="page-title">운영 기록 정리</h1>
          <p class="desc">만료된 임시 운영 기록의 자동 정리 상태를 확인합니다.</p>
        </div>
      </div>
    </section>

    <section class="grit-section">
      <div class="task-notice">
        <strong>운영 방침:</strong>
        <p style="margin:8px 0 0;">매일 03:00 자동 실행</p>
        <p style="margin:4px 0 0;">만료된 임시 인증·가입·연동 시도 기록만 자동으로 정리합니다.</p>
      </div>
      <div id="operationTaskStatus" class="muted">최근 자동 정리 결과를 불러오는 중입니다...</div>
      <div class="record-cleanup-panel">
        <div id="recordCleanupMessage" class="record-cleanup-message" hidden></div>
        <ul id="recordCleanupCounts" class="record-cleanup-counts" hidden></ul>
      </div>
    </section>

  </main>

  <div data-include="footer"></div>
</body>
</html>
