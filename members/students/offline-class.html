<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>그릿에듀 | 오프라인 반</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#ff7a00" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
<script type="module" src="/assets/js/firebase-init.js"></script>
  <script type="module" src="/assets/js/common.js"></script>
  <script src="/assets/js/pwa-register.js" defer></script>
  <script type="module" src="/assets/js/pages/student-offline-class.js"></script>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="student-offline-class-page">
  <div data-include="header"></div>

  <main class="grit-page-container" id="offlineClassPage">
    <div class="dash-back">
      <a href="/members/students/dashboard.html" class="btn sm dash-back__link" aria-label="내 강의실로 돌아가기" title="내 강의실로 돌아가기">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </a>
    </div>

    <section class="grit-section student-offline-class-head" id="offlineClassHead">
      <!-- 로딩 skeleton: 반 요약 카드 자리(offline-class-detail.css 실측값). JS 가 이 영역을 통째로 바꾼다. -->
      <div class="dashboard-skeleton offline-class-summary-skeleton" aria-hidden="true"></div>
      <span class="sr-only" id="offlineClassLoading">반 정보를 불러오는 중입니다…</span>
    </section>

    <!-- 처음부터 보이게 두고 회차 skeleton 을 그린다. 막힌 반이면 JS 가 다시 숨긴다. -->
    <section class="grit-section student-offline-sessions-section" id="offlineSessionsSection">
      <div class="student-offline-sessions-head">
        <h2 class="section-title">수업별 영상</h2>
      </div>
      <div id="offlineSessionsList" class="student-offline-sessions-list" aria-live="polite">
        <div class="dashboard-skeleton offline-session-skeleton" aria-hidden="true"></div>
        <div class="dashboard-skeleton offline-session-skeleton" aria-hidden="true"></div>
      </div>
      <nav id="offlineSessionsPagination" class="student-offline-sessions-pagination" aria-label="수업별 영상 페이지" hidden></nav>
    </section>
  </main>

  <div data-include="footer"></div>
</body>
</html>
