<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>그릿에듀 | 로그인</title>

  <link rel="icon" href="/assets/favicon.png" type="image/png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#ff7a00" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
<!-- 테마 즉시 적용 및 조건부 이미지 프리로드 -->
  <script>
    (function() {
      const THEME_KEY = 'grit-theme';
      function getCurrentTheme() {
        try {
          return localStorage.getItem(THEME_KEY) || 
            (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch {
          return 'light';
        }
      }
      const theme = getCurrentTheme();
      document.documentElement.setAttribute('data-theme', theme);
      
      // 현재 테마에 따라 필요한 이미지만 preload
      const link = document.createElement('link');
      link.rel = 'preload';
      link.as = 'image';
      link.href = theme === 'dark' ? '/assets/lightmode.png' : '/assets/darkmode.png';
      document.head.appendChild(link);
    })();
  </script>
  <script type="module" src="/assets/js/firebase-init.js"></script>
  <script type="module" src="/assets/js/common.js"></script>
  <script src="/assets/js/pwa-register.js" defer></script>
  <script type="module" src="/assets/js/pages/login.js"></script>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>

<body>
  <div data-include="header"></div>

  <main class="auth-wrap" aria-labelledby="loginTitle">
    <div class="auth-card" role="form" aria-describedby="loginDesc">
      <h1 id="loginTitle">로그인</h1>

      <form id="loginForm" novalidate autocomplete="on">
        <label for="email">이메일</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          placeholder="example@gritedu.com"
          inputmode="email"
          autocomplete="username"
        />

        <label for="password">비밀번호</label>
        <div class="password-input-group" style="position:relative;display:flex;align-items:center;">
          <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="********"
            autocomplete="current-password"
            style="padding-right:48px;"
          />

            <svg data-password-visible-icon hidden width="20" height="20" style="display:none;width:20px;height:20px;" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor"><path d="M247.31,124.76c-.35-.79-8.82-19.58-27.65-38.41C194.57,61.26,162.88,48,128,48S61.43,61.26,36.34,86.35C17.51,105.18,9,124,8.69,124.76a8,8,0,0,0,0,6.48c.35.79,8.82,19.58,27.65,38.41C61.43,194.74,93.12,208,128,208s66.57-13.26,91.66-38.35c18.83-18.83,27.3-37.62,27.65-38.41A8,8,0,0,0,247.31,124.76ZM128,192c-30.78,0-57.67-11.19-79.93-33.25A133.47,133.47,0,0,1,25,128,133.47,133.47,0,0,1,48.07,97.25C70.33,75.19,97.22,64,128,64s57.67,11.19,79.93,33.25A133.47,133.47,0,0,1,231,128C223.07,142.48,189.8,192,128,192Zm0-112a48,48,0,1,0,48,48A48.05,48.05,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160Z"/></svg>
          </button>
        </div>

        <p class="text-sm text-muted mt-8 mb-16">이메일 또는 비밀번호 관련 문의는 학원으로 연락해 주세요.</p>

        <button type="submit" class="btn primary" id="loginButton">
          <span class="button-text">로그인</span>
          <span class="button-spinner hidden">
            <span class="loading-spinner" style="width: 16px; height: 16px; border-width: 2px;"></span>
          </span>
        </button>
        <p id="loginStatus" class="desc"></p>
      </form>

      <div class="signup-section">
        <p>아직 계정이 없으신가요?</p>
        <a href="/members/signup.html" class="btn w-full">회원가입</a>
      </div>
    </div>
  </main>

  <div data-include="footer"></div>
</body>
</html>
